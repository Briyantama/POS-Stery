x-service-defaults: &service-defaults
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5433
  POSTGRES_DB: pos_db
  POSTGRES_APP_PASSWORD: changeme
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: redis
  NATS_URL: nats://pos:changeme@nats:4222
  NATS_USER: pos
  NATS_PASSWORD: changeme
  SERVICE_TOKEN_SECRET: changeme
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  LOG_LEVEL: debug
  ENVIRONMENT: development

services:
  postgres:
    image: postgres:16-alpine
    container_name: pos-postgres
    environment:
      POSTGRES_DB: pos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "5433:5432"
    networks:
      - pos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pos-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    ports:
      - "6379:6379"
    networks:
      - pos-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: pos-nats
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - nats_data:/data/jetstream
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - pos-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: pos-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - pos-net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: pos-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - pos-net

  auth-service:
    build:
      context: ../..
      dockerfile: services/Dockerfile.base
      args:
        SERVICE: auth-service
    image: pos-stery/auth-service:dev
    container_name: pos-auth-service
    environment:
      <<: *service-defaults
      JWT_RS256_PRIVATE_KEY_PATH: /keys/private.pem
      JWT_RS256_PUBLIC_KEY_PATH: /keys/public.pem
      GRPC_PORT: 8081
      METRICS_PORT: 9101
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - redis
      - nats
      - jaeger
    volumes:
      - ../../keys:/keys:ro
      - auth_service_data:/var/lib/auth-service
    networks:
      - pos-net

  product-service:
    build:
      context: ../..
      dockerfile: services/Dockerfile.base
      args:
        SERVICE: product-service
    image: pos-stery/product-service:dev
    container_name: pos-product-service
    environment:
      <<: *service-defaults
      GRPC_PORT: 8082
      METRICS_PORT: 9102
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - redis
      - nats
      - jaeger
    networks:
      - pos-net

  inventory-service:
    build:
      context: ../..
      dockerfile: services/Dockerfile.base
      args:
        SERVICE: inventory-service
    image: pos-stery/inventory-service:dev
    container_name: pos-inventory-service
    environment:
      <<: *service-defaults
      GRPC_PORT: 8083
      METRICS_PORT: 9103
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - redis
      - nats
      - jaeger
    networks:
      - pos-net

  sales-service:
    build:
      context: ../..
      dockerfile: services/Dockerfile.base
      args:
        SERVICE: sales-service
    image: pos-stery/sales-service:dev
    container_name: pos-sales-service
    environment:
      <<: *service-defaults
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      GRPC_PORT: 8084
      METRICS_PORT: 9104
    ports:
      - "8084:8084"
    depends_on:
      - postgres
      - redis
      - nats
      - inventory-service
      - jaeger
    networks:
      - pos-net

  supplier-service:
    build:
      context: ../..
      dockerfile: services/Dockerfile.base
      args:
        SERVICE: supplier-service
    image: pos-stery/supplier-service:dev
    container_name: pos-supplier-service
    environment:
      <<: *service-defaults
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      GRPC_PORT: 8085
      METRICS_PORT: 9105
    ports:
      - "8085:8085"
    depends_on:
      - postgres
      - redis
      - nats
      - inventory-service
      - jaeger
    networks:
      - pos-net

  customer-service:
    build:
      context: ../..
      dockerfile: services/Dockerfile.base
      args:
        SERVICE: customer-service
    image: pos-stery/customer-service:dev
    container_name: pos-customer-service
    environment:
      <<: *service-defaults
      GRPC_PORT: 8086
      METRICS_PORT: 9106
    ports:
      - "8086:8086"
    depends_on:
      - postgres
      - redis
      - nats
      - jaeger
    networks:
      - pos-net

  api-gateway:
    build:
      context: ../..
      dockerfile: apps/api-gateway/Dockerfile
    image: pos-stery/api-gateway:dev
    container_name: pos-api-gateway
    environment:
      APP_URL: http://localhost:8000
      AUTH_SERVICE_URL: http://auth-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      SALES_SERVICE_URL: http://sales-service:8084
      SUPPLIER_SERVICE_URL: http://supplier-service:8085
      CUSTOMER_SERVICE_URL: http://customer-service:8086
      SERVICE_TOKEN_SECRET: changeme
      APP_ENV: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - product-service
      - inventory-service
      - sales-service
      - supplier-service
      - customer-service
      - postgres
      - redis
      - nats
    networks:
      - pos-net

  admin:
    image: node:20-alpine
    container_name: pos-admin
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      GATEWAY_URL: http://api-gateway:8000
      HOST: 0.0.0.0
      PORT: 5173
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ../../apps/admin:/app
      - admin_node_modules:/app/node_modules
    depends_on:
      - api-gateway
    networks:
      - pos-net

  cashier:
    image: node:20-alpine
    container_name: pos-cashier
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      GATEWAY_URL: http://api-gateway:8000
      HOST: 0.0.0.0
      PORT: 5174
      NODE_ENV: development
    ports:
      - "5174:5174"
    volumes:
      - ../../apps/cashier:/app
      - cashier_node_modules:/app/node_modules
    depends_on:
      - api-gateway
    networks:
      - pos-net

volumes:
  postgres_data:
  nats_data:
  auth_service_data:
  admin_node_modules:
  cashier_node_modules:

networks:
  pos-net:
    driver: bridge
