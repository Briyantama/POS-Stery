port: 4222
http_port: 8222

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 256MB
  max_file_store: 2GB
}

accounts {
  POS {
    jetstream: enabled
    users: [
      { user: pos, password: "changeme" }
    ]
    exports: [
      { stream: "POS_EVENTS.>" }
    ]
  }
}

# POS_EVENTS stream is created programmatically by services/_shared/nats/streams.go
# on service startup (creates if not exists, idempotent).
# Subjects: Product.LowStock, Sale.Completed, Inventory.Replenished,
#           Customer.New, AI.OrderForecasted
