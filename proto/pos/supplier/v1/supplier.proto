syntax = "proto3";

package pos.supplier.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/pos-stery/pos-stery/gen/go/pos/supplier/v1;supplierv1";

service SupplierService {
  rpc AddSupplier(AddSupplierRequest) returns (AddSupplierResponse) {
    option (google.api.http) = {
      post: "/v1/suppliers"
      body: "*"
    };
  }

  rpc ListSuppliers(ListSuppliersRequest) returns (ListSuppliersResponse) {
    option (google.api.http) = {
      get: "/v1/suppliers"
    };
  }

  rpc CreatePurchaseOrder(CreatePurchaseOrderRequest) returns (CreatePurchaseOrderResponse) {
    option (google.api.http) = {
      post: "/v1/purchase-orders"
      body: "*"
    };
  }

  rpc ListPurchaseOrders(ListPurchaseOrdersRequest) returns (ListPurchaseOrdersResponse) {
    option (google.api.http) = {
      get: "/v1/purchase-orders"
    };
  }

  rpc ReceiveStock(ReceiveStockRequest) returns (ReceiveStockResponse) {
    option (google.api.http) = {
      post: "/v1/purchase-orders/{purchase_order_id}/receive"
      body: "*"
    };
  }
}

message AddSupplierRequest {
  string tenant_id = 1;
  string name      = 2;
  string contact   = 3;
  string phone     = 4;
  string email     = 5;
  string address   = 6;
}

message AddSupplierResponse {
  Supplier supplier = 1;
}

message ListSuppliersRequest {
  string tenant_id = 1;
  int32  limit     = 2;
  int32  offset    = 3;
}

message ListSuppliersResponse {
  repeated Supplier suppliers = 1;
  int32             total     = 2;
}

message CreatePurchaseOrderRequest {
  string                    tenant_id   = 1;
  string                    store_id    = 2;
  string                    supplier_id = 3;
  repeated PurchaseOrderItem items      = 4;
  string                    notes       = 5;
}

message CreatePurchaseOrderResponse {
  PurchaseOrder order = 1;
}

message ListPurchaseOrdersRequest {
  string tenant_id  = 1;
  string store_id   = 2;
  string status     = 3; // PENDING | RECEIVED | CANCELLED
  int32  limit      = 4;
  int32  offset     = 5;
}

message ListPurchaseOrdersResponse {
  repeated PurchaseOrder orders = 1;
  int32                  total  = 2;
}

message ReceiveStockRequest {
  string                    tenant_id         = 1;
  string                    store_id          = 2;
  string                    purchase_order_id = 3;
  repeated ReceivedItem     items_received    = 4;
}

message ReceiveStockResponse {
  PurchaseOrder order = 1;
}

message PurchaseOrderItem {
  string product_id       = 1;
  int32  quantity_ordered = 2;
  double unit_cost        = 3;
}

message ReceivedItem {
  string product_id         = 1;
  int32  quantity_received  = 2;
}

message Supplier {
  string                    supplier_id = 1;
  string                    tenant_id   = 2;
  string                    name        = 3;
  string                    contact     = 4;
  string                    phone       = 5;
  string                    email       = 6;
  string                    address     = 7;
  google.protobuf.Timestamp created_at  = 8;
}

message PurchaseOrder {
  string                    order_id    = 1;
  string                    tenant_id   = 2;
  string                    store_id    = 3;
  string                    supplier_id = 4;
  repeated PurchaseOrderItem items      = 5;
  string                    status      = 6;
  string                    notes       = 7;
  google.protobuf.Timestamp created_at  = 8;
  google.protobuf.Timestamp updated_at  = 9;
}
